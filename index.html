      --shadow: 0 20px 50px rgba(18, 46, 81, 0.12);

        --line: #24364d;
        --text: #edf3ff;

    * {

    }

    html {

      background: var(--bg);
    }

    body {

    body,

    .topbar {

      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(19, 41, 70, 0.06);

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar::after {
      content: "";
      position: absolute;
      right: 0;
      left: 0;
      bottom: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.9;

    .topbar .text {

      align-items: center;

    }

    .addrow input[type=text] {

      background: var(--sky);
      border: 1px solid var(--line);
      color: #000;
      border-radius: 8px;
      padding: 9px 10px;
      font-family: inherit;
      font-size: .88rem
    }

    .addrow button {
      background: var(--gold);

    .status-line {
      margin-top: 14px;
      font-size: .85rem;
      font-weight: 700
    }

    .status-line.ok {
      color: var(--ok)
    }

    .status-line.need {
      color: var(--need)
    }

    .nav-row {
      display: flex;
      gap: 10px;

    .btn-ghost {

      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: inherit;
      box-shadow: 0 0 12px rgba(18, 59, 103, .12)
    }

    .subhead {
      font-weight: 900;
      font-size: .86rem;
      margin: 22px 0 9px;
      color: var(--primary)
    }

    .pillbox {
      display: flex;
      flex-wrap: wrap;
      gap: 7px
    }

    .pill {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      font-size: .68rem;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #F8FAFC;
      color: #111827
    }

    .pill-name {
      line-height: 1.45;
    }

    .pill-reason {
      color: #8b5e1a;
      font-size: .62rem;
      font-weight: 700;
      line-height: 1.45;
    }

    .pill.eligible {
      border-color: #BFE2CE;
      color: var(--success);
      font-weight: 800;
      background: #F3FAF6
    }

    .pill.blocked {
      color: #8996A4;
      background: #FAFBFC;
      border-color: #E4D6B8;
      cursor: default;
    }

    .pill.blocked .pill-name {
      color: #687789;
    }

    .pill.blocked .pill-reason:before {
      content: "🔒 ";
    }

    .empty-note {
      color: var(--muted);
      font-size: .72rem;
      line-height: 1.7
    }

    @media(max-width:720px) {
      .topbar {
        padding: 12px 16px;
        min-height: 76px
      }

      .topbar .t1 {
        font-size: .95rem
      }

      .topbar .t2 {
        font-size: .68rem
      }

      .topbar .logo-box {
        height: 50px;
        padding: 6px 8px
      }

      .topbar .logo-box img {
        height: 35px
      }

      .wrap {
        padding: 25px 14px 45px
      }

      .card {
        padding: 23px 17px;
        border-radius: 18px
      }

      .card h2 {
        font-size: 1.13rem
      }

      ul.items {
        grid-template-columns: 1fr;
        max-height: 56vh;
        gap: 7px
      }

      .progress-row {
        gap: 5px
      }

      .dot {
        height: 6px
      }

      .nav-row {
        gap: 8px
      }

      .btn {
        font-size: .75rem;
        padding: 12px 10px
      }
    }

    @media(max-width:420px) {
      .topbar .text {
        max-width: 72%
      }

      .hero-total .n {
        font-size: 2.45rem
      }

      .addrow {
        flex-direction: column
      }

      .addrow button {
        width: 100%
      }
    }
  </style>

</head>

    function completedSet() {
      const s = new Set();
      COURSES.forEach(c => { if (c.cat !== 'ue' && isChecked(c.cat, c.code)) s.add(c.code); });
      ['U-CT', 'U-IE'].forEach(code => { if (isChecked('ue', code)) s.add(code); });
      return s;
    }
    function isEligible(course, done) { return course.pre.every(p => done.has(p)); }

    function sectionResult(sec) {
      if (sec.id === 'ue') {
        const reqOk = sec.items.every(c => isChecked('ue', c.code));
        const extraChecked = state._uniExtra.filter(x => x.checked).length;
        const count = sec.items.filter(c => isChecked('ue', c.code)).length + extraChecked;
        return { hrs: Math.min(count * 2, sec.total), count, need: sec.need, ok: reqOk && count >= sec.need };
      }
      const extraCourses = sec.id === 'fe' ? state._feExtra.filter(course => course.checked) : [];
      const c = sec.items.filter(x => isChecked(sec.id, x.code)).length + extraCourses.length;
      const hrs = sec.items.filter(x => isChecked(sec.id, x.code)).reduce((a, x) => a + x.hrs, 0) + extraCourses.length * 3;
      if (sec.mode === 'all') return { hrs, count: c, need: sec.items.length, ok: c >= sec.items.length };
      return { hrs: Math.min(hrs, sec.total), count: c, need: sec.need, ok: c >= sec.need };
    }

    function renderProgress() {
      const row = document.getElementById('progressRow'); row.innerHTML = '';
      for (let i = 0; i < TOTAL_STEPS; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i < state._step ? ' done' : (i === state._step ? ' active' : ''));
        row.appendChild(d);
      }
      document.getElementById('stepLabel').textContent = state._step < SECTIONS.length
        ? `خطوة ${state._step + 1} من ${SECTIONS.length} — ${SECTIONS[state._step].name}`
        : `النتيجة النهائية`;
    }

    function updateStepStatus(sec) {
      const r = sectionResult(sec);
      const card = document.getElementById('card');
      card.querySelector('.req-badge').textContent = `${r.hrs} / ${sec.total} ساعة`;
      const st = card.querySelector('.status-line');
      st.className = 'status-line ' + (r.ok ? 'ok' : 'need');
      st.textContent = r.ok ? 'تمام، خلصت المطلوب في القسم ده ✓' : (sec.mode === 'all' ? `لسه فاضلك ${sec.items.length - r.count} مادة` : `اخترت ${r.count} من ${r.need} — لسه محتاج ${Math.max(0, r.need - r.count)}`);
    }

    function renderStepCard(sec) {
      const r = sectionResult(sec);
      const card = document.getElementById('card');
      const extraConfig = sec.id === 'ue'
        ? { key: '_uniExtra', inputId: 'ueAddInput', buttonId: 'ueAddBtn', hrs: 2, placeholder: 'اسم مادة جامعة اختيارية تانية' }
        : sec.id === 'fe'
          ? { key: '_feExtra', inputId: 'feAddInput', buttonId: 'feAddBtn', hrs: 3, placeholder: 'اسم مادة من قسم تاني تُحسب اختياري كلية' }
          : null;
      card.innerHTML = `
    <h2>${sec.name}</h2>
    <p class="desc">${sec.desc}</p>
    <span class="req-badge">${r.hrs} / ${sec.total} ساعة</span>
    <ul class="items"></ul>
    ${extraConfig ? `<div class="addrow"><input type="text" id="${extraConfig.inputId}" placeholder="${extraConfig.placeholder}"><button id="${extraConfig.buttonId}">إضافة</button></div>` : ''}
    <p class="status-line ${r.ok ? 'ok' : 'need'}">${r.ok ? 'تمام، خلصت المطلوب في القسم ده ✓' : (sec.mode === 'all' ? `لسه فاضلك ${sec.items.length - r.count} مادة` : `اخترت ${r.count} من ${r.need} — لسه محتاج ${Math.max(0, r.need - r.count)}`)}</p>
    <div class="nav-row">
      ${state._step > 0 ? '<button class="btn btn-ghost" id="backBtn">رجوع</button>' : '<span style="flex:1"></span>'}
      <button class="btn btn-primary" id="nextBtn">التالي</button>
    </div>`;
      const ul = card.querySelector('ul.items');
      sec.items.forEach(c => {
        const li = document.createElement('li');
        li.innerHTML = `<label><input type="checkbox" ${isChecked(sec.id, c.code) ? 'checked' : ''} data-code="${c.code}"><span>${c.name}</span></label><span class="hrs">${c.hrs}h</span>`;
        ul.appendChild(li);
      });
      const appendExtraCourse = (extra, idx) => {
        const li = document.createElement('li');
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = extra.checked;
        checkbox.dataset.extraIndex = idx;
        const name = document.createElement('span');
        name.textContent = extra.name;
        const hours = document.createElement('span');
        hours.className = 'hrs';
        hours.textContent = `${extraConfig.hrs}h`;
        label.append(checkbox, name);
        li.append(label, hours);
        checkbox.addEventListener('change', e => {
          state[extraConfig.key][+e.target.dataset.extraIndex].checked = e.target.checked;
          save();
          updateStepStatus(sec);
        });
        return li;
      };
      if (extraConfig) {
        state[extraConfig.key].forEach((extra, idx) => ul.appendChild(appendExtraCourse(extra, idx)));
      }
      ul.querySelectorAll('input[data-code]').forEach(cb => {
        cb.addEventListener('change', e => { setChecked(sec.id, e.target.dataset.code, e.target.checked); updateStepStatus(sec); });
      });
      const addBtn = extraConfig && card.querySelector(`#${extraConfig.buttonId}`);
      if (addBtn) addBtn.addEventListener('click', () => {
        const input = card.querySelector(`#${extraConfig.inputId}`);
        const name = input.value.trim();
        if (name) {
          const extra = { name, checked: true };
          state[extraConfig.key].push(extra);
          save();
          ul.appendChild(appendExtraCourse(extra, state[extraConfig.key].length - 1));
          input.value = '';
          updateStepStatus(sec);
        }
      });
      const backBtn = card.querySelector('#backBtn');
      if (backBtn) backBtn.addEventListener('click', () => { state._step--; save(); render(); window.scrollTo(0, 0); });
      card.querySelector('#nextBtn').addEventListener('click', () => { state._step++; save(); render(); window.scrollTo(0, 0); });
    }

    function pillList(courses, done) {
      if (!courses.length) return '<p class="empty-note">مفيش مواد فاضلة هنا 🎉</p>';
      return '<div class="pillbox">' + courses.map(c => {
        const ok = isEligible(c, done);
        const missing = ok ? '' : c.pre.filter(p => !done.has(p)).map(p => byCode[p] ? byCode[p].name : p).join('، ');
        return `<span class="pill ${ok ? 'eligible' : 'blocked'}"><span class="pill-name">${c.name}${ok ? ' ✓' : ''}</span>${ok ? '' : `<span class="pill-reason">محتاج الأول: ${missing}</span>`}</span>`;
      }).join('') + '</div>';
    }

    function sectionRemaining(sec) {
      const remaining = sec.items.filter(c => !isChecked(sec.id, c.code));
      if (sec.id === 'fe') {
        remaining.push(...state._feExtra.filter(course => !course.checked).map(course => ({ ...course, pre: [] })));
      }
      return remaining;
    }

    function remainingInSection(sec, result) {
      if (sec.id === 'ue') {
        const uncheckedRequired = sec.items.filter(c => !isChecked('ue', c.code)).length;
        return Math.max(uncheckedRequired, result.need - result.count, 0);
      }
      const required = sec.mode === 'all' ? sec.items.length : result.need;
      return Math.max(required - result.count, 0);
    }

    function renderSummary() {
      const card = document.getElementById('card');
      let total = 0;
      const done = completedSet();
      const rows = SECTIONS.map(sec => { const r = sectionResult(sec); total += r.hrs; return { sec, r }; });
      const remainingCourses = rows.reduce((count, { sec, r }) => count + remainingInSection(sec, r), 0);
      const pct = Math.min(100, Math.round(total / 140 * 100));

      card.innerHTML = `
    <h2>ملخص ساعات التخرج</h2>
    <div class="hero-total">
      <div class="n">${total}<span> / 140 ساعة</span></div>
      <div class="remaining-count">${remainingCourses} مادة متبقية</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    <div id="summaryRows"></div>
    <div class="nav-row">
      <button class="btn btn-ghost" id="backBtn">رجوع</button>
      <button class="btn btn-primary" id="resetBtn">ابدأ من جديد</button>
    </div>`;
      const sr = card.querySelector('#summaryRows');
      rows.forEach(({ sec, r }) => {
        const wrap = document.createElement('div');
        wrap.className = 'summary';
        const row = document.createElement('div');
        row.className = 'row';
        const remaining = remainingInSection(sec, r);
        const remainingLabel = remaining === 1 ? 'مادة' : 'مواد';
        row.innerHTML = `<b>${sec.name}</b><div class="summary-metrics"><span class="${r.ok ? 'ok' : 'need'}">${r.hrs}/${sec.total}h ${r.ok ? '✓' : '✗'}</span><span class="remaining ${remaining ? 'need' : 'ok'}">باقي ${remaining} ${remainingLabel}</span></div>`;
        wrap.appendChild(row);
        if (!r.ok) {
          const remaining = sectionRemaining(sec);
          const box = document.createElement('div');
          box.style.margin = '4px 0 16px';
          box.innerHTML = pillList(remaining, done);
          wrap.appendChild(box);
          if (sec.id === 'ue' && r.count < r.need) {
            const note = document.createElement('p');
            note.className = 'empty-note';
            note.textContent = '+ محتاج كمان مواد جامعة اختيارية بأسماء مفتوحة (بتتسجل من قائمة الجامعة العامة).';
            wrap.appendChild(note);
          }
        }
        sr.appendChild(wrap);
      });
      card.querySelector('#backBtn').addEventListener('click', () => { state._step = SECTIONS.length - 1; save(); render(); window.scrollTo(0, 0); });
      card.querySelector('#resetBtn').addEventListener('click', () => {
        if (confirm('متأكد؟ هيتم مسح كل الاختيارات.')) { state = { _uniExtra: [], _feExtra: [], _step: 0 }; save(); render(); window.scrollTo(0, 0); }
      });
    }

    function render() {
      renderProgress();
      if (state._step < SECTIONS.length) renderStepCard(SECTIONS[state._step]);
      else renderSummary();
    }
    render();
  </script>
</body>

</html>
